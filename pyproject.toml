[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "masa"
version = "0.1.0"
description = "Local martial-arts video pose inspection and annotation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "ultralytics>=8.3,<9",
  "opencv-python>=4.10,<5",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "imageio-ffmpeg>=0.6,<1",
  "lap>=0.5.12,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
masa = "masa.cli:main"
masa-web = "masa.webapp:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/masa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: real model inference; requires downloaded official weights"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
